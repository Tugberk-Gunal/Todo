<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />

    <!-- Bootstrap CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css"
      integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Todo</title>
  </head>
  <body>
    <!-- ! Body start -->

    <div class="container">
      <div class="row">
        <div class="col text-center my-5">
          <h1 style="font-family: &quot;Courier New&quot;, Courier, monospace">
            Yapılacaklar Listesi
          </h1>
          <input
            type="text"
            class="form-control"
            placeholder="Görev giriniz..."
            id="taskInput"
          />
          <button class="btn btn-primary mt-3" type="submit" id="addTaskBtn">
            Ekle
          </button>
          <button class="btn btn-danger mt-3" id="clearTasksBtn">
            Temizle
          </button>
          <ul class="list-group mt-3" id="taskList"></ul>
        </div>
      </div>
    </div>
    <script src="deneme.js"></script>
    <script src="app.js"></script>
  </body>
</html>
